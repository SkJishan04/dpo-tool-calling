# Model Configuration
model:
  base_model: "meta-llama/Llama-2-7b-hf"  # or "Qwen/Qwen2.5-7B"
  model_type: "llama"  # llama or qwen
  device: "cuda"
  dtype: "bfloat16"

# LoRA Configuration
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "v_proj"

# Training Configuration
training:
  output_dir: "./models/sft_checkpoint"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  warmup_steps: 100
  max_grad_norm: 1.0
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 100
  save_steps: 500
  save_total_limit: 3
  fp16: false
  bf16: true
  dataloader_num_workers: 4

# DPO Configuration
dpo:
  beta: 0.1
  loss_type: "sigmoid"  # sigmoid or hinge
  label_smoothing: 0.0

# Dataset Configuration
dataset:
  name: "tool_calling_preference_dataset"
  version: "1.0"
  split: "train"
  max_length: 512
  num_samples: 10000

# Evaluation Configuration
evaluation:
  eval_size: 1000
  metrics:
    - "schema_accuracy"
    - "tool_precision"
    - "tool_recall"
    - "latency"

# Logging
logging:
  level: "INFO"
  use_wandb: true
  wandb_project: "dpo-tool-calling"
  wandb_entity: "your-entity"